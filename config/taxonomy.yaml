# Relationships only disambiguate broad benchmark concepts. They do not imply
# automatic score propagation or candidate capability levels.
relationships:
  analytical_problem_solving:
    supported_by: [business_analytics, decision_support]
  ai_enabled_work:
    supported_by: [ai_strategy, ai_adoption, ai_assisted_development]
  cross_functional_work:
    supported_by: [cross_functional_leadership, stakeholder_management]
  leadership:
    supported_by: [cross_functional_leadership]
  strategy:
    supported_by: [commercial_strategy, business_case_development]
  technology_domain:
    equivalent_to: technology
  fintech_domain:
    equivalent_to: fintech

