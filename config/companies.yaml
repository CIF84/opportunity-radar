companies:
  - company_id: johnson_johnson
    company_name: Johnson & Johnson
    adapter: workday
    careers_url: https://www.careers.jnj.com/
    endpoint_url: https://jj.wd5.myworkdayjobs.com/JJ
    ats_tenant: wd5|jj|JJ
  - company_id: red_hat
    company_name: Red Hat
    adapter: workday
    endpoint_url: https://redhat.wd5.myworkdayjobs.com/jobs
    ats_tenant: wd5|redhat|jobs
  - company_id: pfizer
    company_name: Pfizer
    adapter: workday
    endpoint_url: https://pfizer.wd1.myworkdayjobs.com/PfizerCareers
    ats_tenant: wd1|pfizer|PfizerCareers

  - company_id: pure_storage
    company_name: Pure Storage
    adapter: greenhouse
    endpoint_url: https://job-boards.greenhouse.io/purestorage
    ats_tenant: purestorage
  - company_id: wrike
    company_name: Wrike
    adapter: greenhouse
    endpoint_url: https://www.wrike.com/jobs/
    ats_tenant: wrike
  - company_id: wpp
    company_name: WPP
    adapter: greenhouse
    endpoint_url: https://job-boards.greenhouse.io/wpp
    ats_tenant: wpp

  - company_id: siemens
    company_name: Siemens
    adapter: almacareer
    endpoint_url: https://siemens.jobs.cz/
    ats_tenant: siemens.jobs.cz
  - company_id: honeywell
    company_name: Honeywell
    adapter: almacareer
    endpoint_url: https://honeywell.jobs.cz/en/positions
    ats_tenant: honeywell.jobs.cz
    options:
      widget_name: main-en
  - company_id: csob
    company_name: ČSOB
    adapter: almacareer
    endpoint_url: https://csob.jobs.cz/
    ats_tenant: csob.jobs.cz

  - company_id: sap
    company_name: SAP
    adapter: successfactors
    endpoint_url: https://jobs.sap.com/go/Czech-Republic/8806201/
    options:
      selectors:
        job_container: "tr.data-row"
        title: "a.jobTitle-link"
        url: "a.jobTitle-link"
        location: ".jobLocation"
      pagination:
        param: startrow
        start: 0
        step: 25
        max_pages: 5
      detail_selectors:
        description: ".jobdescription"
  - company_id: ey
    company_name: EY
    adapter: successfactors
    endpoint_url: https://careers.ey.com/ey/search/
    options:
      selectors:
        job_container: "tr.data-row"
        title: "a.jobTitle-link"
        url: "a.jobTitle-link"
        location: ".jobLocation"
      pagination:
        param: startrow
        start: 0
        step: 25
        max_pages: 5
      detail_selectors:
        description: ".jobdescription"
  - company_id: deutsche_boerse_group
    company_name: Deutsche Börse Group
    adapter: successfactors
    endpoint_url: https://career.deutsche-boerse.com/search/
    options:
      selectors:
        job_container: "tr.data-row"
        title: "a.jobTitle-link"
        url: "a.jobTitle-link"
        location: ".jobLocation"
      pagination:
        param: startrow
        start: 0
        step: 25
        max_pages: 5
      detail_selectors:
        description: ".jobdescription"
        date_posted: ".jobDate"

  - company_id: gooddata
    company_name: GoodData
    adapter: generic_html
    endpoint_url: https://www.gooddata.ai/company/careers/open-positions/
    options:
      external_id_pattern: "-([0-9a-f]{8})/$"
      selectors:
        job_container: ".careers-list-jobs__item"
        title: ".careers-list-jobs__title"
        url: "a.careers-list-jobs__link"
        location: ".careers-list-jobs__locations"
      detail_selectors:
        description: ".p-careers-detail-content"
  - company_id: kiwi_com
    company_name: Kiwi.com
    adapter: generic_html
    endpoint_url: https://jobs.kiwi.com/jobs/
    options:
      selectors:
        job_container: ".b-job"
        title: ".b-job__title"
        url: "a.b-job__link"
        location: ".b-job__definition"
      detail_selectors:
        title: "h1"
        description: ".b-job-detail, main"
  - company_id: allegro
    company_name: Allegro
    adapter: json_feed
    endpoint_url: https://jobs.allegro.eu/wp-json/api/v1/offer
    options:
      query_params: {lang: en}
      items_path: offers
      pagination: {page_param: page, start: 1, pages_path: max_pages, count_path: results_count}
      fields:
        external_job_id: uid
        title: name
        canonical_url: url
        locations: location
        date_posted: releaseDate
        employment_type: contract
        department: team

  - company_id: schneider_electric
    company_name: Schneider Electric
    adapter: json_feed
    endpoint_url: https://careers.se.com/api/jobs
    options:
      query_params: {sortBy: relevance, descending: false, internal: false, limit: 100}
      items_path: jobs
      pagination: {page_param: page, start: 1, count_path: totalCount}
      fields:
        external_job_id: data.req_id
        title: data.title
        canonical_url: data.meta_data.canonical_url
        locations: data.full_location
        description: data.description
        date_posted: data.posted_date
        work_mode: data.location_type

  - company_id: roche
    company_name: Roche
    adapter: phenom
    endpoint_url: https://careers.roche.com/widgets
    options:
      canonical_url_template: https://careers.roche.com/global/en/job/{jobId}/{title_slug}

  - company_id: cisco
    company_name: Cisco
    adapter: phenom
    endpoint_url: https://careers.cisco.com/widgets
    options:
      canonical_url_template: https://careers.cisco.com/global/en/job/{jobId}/{title_slug}
