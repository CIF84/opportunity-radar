[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Technical ingestion feasibility spike"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
opportunity-radar = "opportunity_radar.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: public-source integration tests (excluded by default)"]
addopts = "-m 'not live'"
