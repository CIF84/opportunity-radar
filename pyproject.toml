[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Evidence-first job-market observation and candidate opportunity assessment"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
opportunity-radar = "opportunity_radar.runner:main"
opportunity-radar-state = "opportunity_radar.state_runner:main"
opportunity-radar-phase3 = "opportunity_radar.phase3_runner:main"
opportunity-radar-semantic-roi = "opportunity_radar.roi_experiment:main"
opportunity-radar-live-validation = "opportunity_radar.live_validation:main"
opportunity-radar-scope-measure = "opportunity_radar.scope_measurement:main"
opportunity-radar-status = "opportunity_radar.project_status:main"
opportunity-radar-phase4-replay = "opportunity_radar.phase4_replay:main"
opportunity-radar-phase4-residuals = "opportunity_radar.phase4_residual_diagnostics:main"
opportunity-radar-phase4-prospective = "opportunity_radar.prospective_validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: public-source integration tests (excluded by default)"]
addopts = "-m 'not live'"
