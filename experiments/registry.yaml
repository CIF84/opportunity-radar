  - experiment_id: EXP-STRETCH-EVIDENCE-001
    type: STRETCH_EVIDENCE_BOUNDARY_AUDIT
    hypothesis: Cheap explicit vacancy requirements and frozen candidate capability evidence can identify obvious current fit and excessive stretch while preserving the ambiguous middle for deeper reasoning, without using market or preference evidence as capability proxies.
    status: COMPLETED_AWAITING_REVIEW
    completed_at: "2026-09-13"
    baseline: The frozen 60-item compute-worthiness experiment had three WORTH judgments and 57 NOT_WORTH judgments spanning capability, market, preference, and unavailable-evidence reasons; no separate stretch object existed.
    intervention: Implement a four-class auditable stretch contract with title-scoped role requirements, explicit credential and professional-depth rules, conservative UNKNOWN handling, private frozen-sample adjudication, and read-only current-corpus/cost counterfactuals.
    inputs: [specs/phase4/SPEC-019-stretch-evidence-boundary.md, experiments/stretch_evidence_boundary_v1.yaml, config/candidate.yaml, config/taxonomy.yaml, experiments/semantic_compute_worthiness_v1.yaml, output/opportunity_radar.sqlite3, data/semantic_compute_worthiness/judgments.jsonl]
    artifacts: [docs/stretch_evidence_boundary_audit.md, output/stretch_evidence_boundary/spec019-stretch-evidence-20260913-v3/aggregate_summary.json]
    metrics: {sample_size: 60, current_fit: 7, manageable_stretch: 24, excessive_stretch: 9, unresolved: 20, worth_protected: 3, worth_excessive: 0, excessive_precision: 1.0, excessive_coverage: 0.391304, preference_false_excessive: 0, market_false_excessive: 0, current_corpus_clusters: 3935, current_corpus_unresolved: 3292, routed_excessive: 155, semantic_calls: 0, live_source_calls: 0, sqlite_writes: 0}
    result: A separate stretch evidence object is feasible and all safety gates passed, but 83.7% of the current corpus remained unresolved and 144 of 171 current-corpus excessive classifications were driven by mandatory-degree evidence.
    decision: Do not promote runtime stretch behavior. Recommend a separately frozen shadow-only human validation, emphasizing credential and professional-depth decisions, before any runtime or combined deterministic-rejection experiment.
    limitations: Exploratory sample with three WORTH labels; conservative private-note adjudication is not universal ground truth; title-scoped rules have low coverage; omitted capability remains unknown; current-corpus counts are one local snapshot.
    related_decisions: [DR-012, DR-013, DR-016, DR-021, DR-023, DR-024]
    commit_or_worktree_state: "Implemented against bc14a53 in a dirty worktree; exact private-evidence and operational database hashes are preserved in the sanitized aggregate"
