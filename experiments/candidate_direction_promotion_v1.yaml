  decision_preference_fingerprint: 394342b487cc3b7b36f6f8a2cd38a5ea2f6c747af73f9f5f409b7fcb3ca359f5
  promoted_entries:
    - concept_id: account_management_execution
      source_type: PREFERENCE
      stance: NEGATIVE
      evidence_count: 6
      evidence_source: PRIVATE_EXPLICIT_HUMAN_JUDGMENTS

concept_audit:
  - concept_id: business_analytics
    evidence_category: POSITIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing EXPERT capability, analytical-problem-solving preference, decision-intelligence preference, and strategic goal already carry this evidence; another post-semantic effect would double count it.
  - concept_id: decision_intelligence
    evidence_category: POSITIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing VERY_HIGH role-characteristic preference and strategic goal already expose this direction to semantic-v1.
  - concept_id: ai_enabled_work
    evidence_category: POSITIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing strong-positive AI-enabled work, transformation execution, and implementation ownership effects already represent AI-transformation attraction.
  - concept_id: ai_assisted_development
    evidence_category: POSITIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing candidate capability and AI-enabled career evidence represent the bounded direction without rewarding conventional software-engineering identity.
  - concept_id: implementation_ownership
    evidence_category: POSITIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing strong-positive decision preference already represents execution authority.
  - concept_id: account_management_execution
    evidence_category: REPEATED_EXPLICIT_AVERSION
    verdict: PROMOTE_NEGATIVE
    proposed_source_type: PREFERENCE
    proposed_stance: NEGATIVE
    rationale: Repeated explicit human evidence rejects returning to account-management/account-executive ownership; title-only matching keeps the boundary separate from commercial strategy, revenue operations, retention strategy, and business development.
  - concept_id: customer_service_operations
    evidence_category: NEGATIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing negative decision preference covers customer-service operations.
  - concept_id: technical_support
    evidence_category: NEGATIVE_DIRECTION
    verdict: INSUFFICIENT_EVIDENCE
    rationale: Explicit evidence exists, but the frozen sample contains only one narrow title-supported case and does not satisfy the repeated-evidence promotion gate.
  - concept_id: software_testing_qa
    evidence_category: AUTOMATION_CONVICTION
    verdict: KEEP_CONTEXTUAL_ONLY
    rationale: The available judgment combines role aversion and future-value conviction; a durable generic preference would overgeneralize from one case.
  - concept_id: mundane_administrative_automation_exposure
    evidence_category: AUTOMATION_CONVICTION
    verdict: KEEP_AS_CONVICTION_ONLY
    rationale: Repeated concern is real but current evidence does not support a narrow deterministic matcher that would avoid suppressing attractive transformation work.
  - concept_id: advisory_without_implementation_ownership
    evidence_category: NEGATIVE_DIRECTION
    verdict: ALREADY_REPRESENTED_SUFFICIENTLY
    rationale: Existing negative decision preference and implementation-ownership override already preserve the intended trade-off.
  - concept_id: healthcare
    evidence_category: CONTEXTUAL_DOMAIN_OPENNESS
    verdict: KEEP_CONTEXTUAL_ONLY
    rationale: Evidence rejects individual qualification mismatches, not the healthcare domain; no preference change is warranted.
  - concept_id: robotics
    evidence_category: CONTEXTUAL_DOMAIN_OPENNESS
    verdict: KEEP_CONTEXTUAL_ONLY
    rationale: Evidence supports openness rather than a stable positive effect; no preference change is warranted.

promotion_gates:
  require_repeated_explicit_evidence: true
  require_narrow_matching: true
  known_positive_demotion_maximum: 0
  semantic_reassessments_maximum: 0
  require_semantic_profile_unchanged: true
  require_scoring_preferences_unchanged: true
  require_market_policy_unchanged: true

privacy:
  detailed_artifact: PRIVATE_LOCAL
  aggregate_artifact: REPOSITORY_SAFE
  raw_human_notes: PRIVATE_LOCAL_APPEND_ONLY

outputs:
  root: output/candidate_direction_promotion
