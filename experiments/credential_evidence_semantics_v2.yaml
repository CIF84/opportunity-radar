schema_version: 1
protocol_version: credential-evidence-semantics-v2
experiment_id: EXP-CREDENTIAL-EVIDENCE-SEMANTICS-002
experiment_type: FROZEN_CREDENTIAL_EVIDENCE_SEMANTICS_VALIDATION
specification: specs/phase4/SPEC-021-frozen-credential-evidence-semantics-v2.md
preparation_id: spec021-credential-evidence-preparation-20260916-v2

inputs:
  candidate_path: config/candidate.yaml
  taxonomy_path: config/taxonomy.yaml
  database_path: output/opportunity_radar.sqlite3

evidence:
  context_characters_before: 500
  context_characters_after: 900
  maximum_context_characters: 1800
  maximum_credential_statements: 6
  maximum_related_requirements: 8
  credential_patterns:
    BACHELORS_DEGREE:
      - "\\bbachelor(?:'s|’s|s)?(?: degree)?\\b"
      - "\\bbaccalaureate(?: degree)?\\b"
      - "\\bundergraduate degree\\b"
    MASTERS_DEGREE:
      - "\\bmaster(?:'s|’s|s)? degree\\b"
      - "\\bgraduate degree\\b"
    DOCTORATE_DEGREE:
      - "\\b(?:Ph\\.?D\\.?|doctorate|doctoral degree)\\b"
      - "\\bJuris Doctor(?: \\(JD\\))?\\b"
    GENERAL_ACADEMIC_DEGREE:
      - "\\b(?:university|college|academic) degree\\b"
      - "\\bdegree (?:in|from) [A-Za-z]"
    PROFESSIONAL_LICENSE:
      - "\\b(?:active )?bar admission\\b"
      - "\\badmission to practice law\\b"
      - "\\blicensed (?:attorney|lawyer|physician|pharmacist)\\b"
      - "\\b(?:CPA|ACCA|chartered accountant)\\b"
  regulated_title_patterns:
    - "\\b(?:legal|lawyer|attorney|counsel|tax controversy)\\b"
    - "\\b(?:physician|medical director|pharmacist|registered nurse)\\b"
    - "\\b(?:accountant|accounting|controller|audit)\\b"
  hard_modal_pattern: "\\b(?:must|required|requires?|mandatory|minimum qualification|shall)\\b"
  equivalent_experience_pattern: "\\b(?:or|and/or) (?:an )?(?:equivalent|comparable)(?: combination of)?(?: education(?:,| and| /)? training)?(?: and| /)? (?:(?:professional|practical|work) )?experience\\b"
  preferred_modal_pattern: "\\b(?:preferred|ideally|ideal|desirable|nice to have|an advantage|a plus|would be a plus)\\b"
  qualification_context_pattern: "\\b(?:qualifications?|requirements?|education|your profile|what you (?:bring|need)|skills and experience|to qualify)\\b"
  related_requirement_pattern: "\\b(?:\\d{1,2}\\+? years?|experience (?:in|with)|knowledge of|proficien(?:t|cy)|expertise in|certification|licen[cs](?:e|ed|ure)|admission to practice)\\b"
  explicit_years_pattern: "\\b(?:at least |minimum of )?\\d{1,2}\\+? years?(?: of)?(?: relevant| professional| hands-on)? experience\\b"

candidate_projection:
  maximum_role_history_items: 4
  maximum_direct_capabilities: 8
  maximum_adjacent_capabilities: 6
  maximum_developing_capabilities: 6
  capability_aliases:
    business_operations: [business operations, operational excellence]
    business_analytics: [business analytics, analytics, analytical]
    decision_support: [decision support, decision-making, decision making]
    pricing_strategy: [pricing strategy, pricing]
    forecasting: [forecasting, forecast]
    experimentation: [experimentation, experiment]
    business_case_development: [business case, business cases]
    scenario_modeling: [scenario modeling, scenario planning]
    stakeholder_management: [stakeholder management, stakeholders]
    executive_communication: [executive communication, senior executives]
    cross_functional_leadership: [cross-functional leadership, cross functional leadership]
    transformation: [transformation, operating model]
    change_management: [change management, organizational change]
    customer_retention: [customer retention, retention]
    commercial_strategy: [commercial strategy, business strategy]
    machine_learning_business_application: [machine learning, ML, artificial intelligence]
    ai_strategy: [AI strategy, artificial intelligence strategy]
    ai_adoption: [AI adoption, artificial intelligence adoption]
    ai_assisted_development: [AI-assisted development, AI assisted development]
    excel: [Excel]
    sql: [SQL]
    python: [Python]
    power_bi: [Power BI]
    software_architecture: [software architecture, systems architecture]
    product_development: [product development]
  relationship_aliases:
    analytical_problem_solving: [analytical problem solving, problem solving]
    ai_enabled_work: [AI-enabled, artificial intelligence]
    cross_functional_work: [cross-functional, cross functional]
    leadership: [leadership, lead teams]
    strategy: [strategy, strategic]

sampling:
  seed: credential-evidence-semantics-v2-20260916
  target: 36
  employer_cap: 8
  employer_per_class_cap: 3
  reserve_per_class: 2
  class_targets:
    EXPLICIT_HARD: 6
    DEGREE_OR_EQUIVALENT_EXPERIENCE: 6
    PREFERRED_OR_IDEAL: 5
    MIXED_MANDATORY_PREFERRED: 5
    GENERIC_OR_TEMPLATE: 5
    AMBIGUOUS: 5
    CONSTITUTIVE_OR_REGULATED: 4

human_labels:
  credential_semantics:
    - HARD_CREDENTIAL
    - DEGREE_OR_EQUIVALENT_EXPERIENCE
    - PREFERRED_CREDENTIAL
    - GENERIC_OR_NONDECISIVE_CREDENTIAL
    - AMBIGUOUS_CREDENTIAL
    - EVIDENCE_CAPTURE_INVALID
  experiential_substitution:
    - EXPERIENCE_STRONGLY_SUBSTITUTES
    - EXPERIENCE_PARTIALLY_SUBSTITUTES
    - NO_CREDIBLE_EXPERIENTIAL_SUBSTITUTE
    - CREDENTIAL_CONSTITUTIVE_OR_NON_SUBSTITUTABLE
    - NEED_MORE_INFORMATION
  independent_capability_gaps:
    - DOMAIN_EXPERTISE_GAP
    - TECHNICAL_SKILL_GAP
    - PROFESSIONAL_FUNCTION_GAP
    - REGULATORY_OR_LICENSE_GAP
    - SENIORITY_DEPTH_GAP
    - LANGUAGE_GAP
    - OTHER_CAPABILITY_GAP

replacement:
  invalidity_reasons:
    - INSUFFICIENT_CAPTURE
    - PROVEN_SOURCE_CONFLICT
    - CORRUPT_OR_INCONSISTENT

privacy:
  evidence_manifest: PRIVATE_LOCAL
  blind_review: PRIVATE_LOCAL
  human_judgments: PRIVATE_LOCAL_APPEND_ONLY
  replacements: PRIVATE_LOCAL_APPEND_ONLY
  detailed_report: PRIVATE_LOCAL
  aggregate_summary: REPOSITORY_SAFE

outputs:
  root: output/credential_evidence_validation
  judgments: data/credential_evidence_validation/judgments.jsonl
  replacements: data/credential_evidence_validation/replacements.jsonl
