schema_version: 1
protocol_version: credential-semantics-v1
experiment_id: EXP-CREDENTIAL-SEMANTICS-001
experiment_type: CREDENTIAL_SEMANTICS_HUMAN_VALIDATION
specification: specs/phase4/SPEC-020-credential-semantics-human-validation.md

inputs:
  stretch_config_path: experiments/stretch_evidence_boundary_v1.yaml
  candidate_path: config/candidate.yaml
  taxonomy_path: config/taxonomy.yaml
  prospective_protocol_path: experiments/phase4_prospective_validation_v1.yaml
  database_path: output/opportunity_radar.sqlite3

source_population:
  stretch_class: EXCESSIVE_STRETCH
  credential_concept_id: bachelors_degree
  decisive_reason_code: MANDATORY_CREDENTIAL_ABSENT

sampling:
  seed: credential-semantics-v1-20260914
  target: 50
  employer_cap_target: 5
  authorized_employer_cap: 22
  authorized_employer_distribution:
    ey: 22
    johnson_johnson: 22
    schneider_electric: 6
  reserve_per_major_stratum: 5
  major_stratum: credential_sampling_stratum
  cap_relaxation_status: HUMAN_AUTHORIZED
  employer_concentration_limitation: "Only three employers exist in the verified degree-driven population; the balanced sample is not a population-prevalence estimate."

reporting:
  views:
    - UNWEIGHTED_STRATIFIED_SAMPLE
    - EMPLOYER_POPULATION_WEIGHTED_ESTIMATE
  population_weight_basis: VERIFIED_144_CASE_EMPLOYER_DISTRIBUTION
  complete_employer_coverage:
    schneider_electric: 6

role_families:
  - family_id: TECHNOLOGY_ENGINEERING
    title_patterns:
      - "\\b(?:software|data|cloud|security|technology|technical|engineer|developer|architect|IT)\\b"
  - family_id: FINANCE_ACCOUNTING_TAX
    title_patterns:
      - "\\b(?:finance|financial|accounting|accountant|tax|treasury|audit)\\b"
  - family_id: CONSULTING_TRANSFORMATION
    title_patterns:
      - "\\b(?:consultant|consulting|transformation|advisory)\\b"
  - family_id: OPERATIONS_PROGRAM
    title_patterns:
      - "\\b(?:operations|operational|program|programme|project|supply chain)\\b"
  - family_id: COMMERCIAL_CLIENT
    title_patterns:
      - "\\b(?:sales|commercial|marketing|client|customer|account)\\b"
  - family_id: PEOPLE_HR
    title_patterns:
      - "\\b(?:human resources|HR|people|talent|recruit)\\b"
  - family_id: HEALTHCARE_SCIENCE
    title_patterns:
      - "\\b(?:medical|clinical|science|scientific|health)\\b"

wording_patterns:
  explicit_equivalent_experience: "\\b(?:or|and/or) (?:an )?equivalent(?: combination of)?(?: education and)? experience\\b"
  preferred_context: "\\b(?:preferred|desirable|ideally|nice to have|an advantage|a plus)\\b"
  must_have: "\\bmust (?:have|hold)\\b"
  explicitly_required: "\\b(?:required|requires?|requirement)\\b"

qualification_excerpt:
  context_characters_before: 500
  context_characters_after: 700
  maximum_characters: 1400

candidate_evidence:
  maximum_role_history_items: 3
  maximum_relevant_capabilities: 8

human_labels:
  credential_semantics:
    - HARD_CREDENTIAL
    - DEGREE_OR_EQUIVALENT_EXPERIENCE
    - PREFERRED_CREDENTIAL
    - GENERIC_OR_NONDECISIVE_CREDENTIAL
    - AMBIGUOUS_CREDENTIAL
    - INVALID_OR_STALE_EVIDENCE
  candidacy_consequence:
    - DEGREE_GAP_DECISIVE
    - EXPERIENCE_PLAUSIBLY_SUBSTITUTES
    - DEGREE_GAP_NOT_DECISIVE
    - NEED_MORE_INFORMATION
  optional_reasons:
    - EXPLICIT_MANDATORY_WORDING
    - EXPLICIT_EQUIVALENT_PATH
    - EXPLICIT_PREFERRED_WORDING
    - GENERIC_TEMPLATE_CONTEXT
    - SOURCE_EVIDENCE_AMBIGUOUS
    - SOURCE_EVIDENCE_STALE
    - RELEVANT_EXPERIENCE_PRESENT
    - RELEVANT_EXPERIENCE_INSUFFICIENT
    - CANDIDATE_EVIDENCE_INSUFFICIENT

replacement:
  controlled_reasons:
    - INVALID_SOURCE_EVIDENCE
    - STALE_SOURCE_EVIDENCE
    - INSUFFICIENT_FROZEN_EVIDENCE

privacy:
  manifest: PRIVATE_LOCAL
  blind_review: PRIVATE_LOCAL
  human_judgments: PRIVATE_LOCAL_APPEND_ONLY
  replacements: PRIVATE_LOCAL_APPEND_ONLY
  detailed_report: PRIVATE_LOCAL
  aggregate_summary: REPOSITORY_SAFE

outputs:
  root: output/credential_semantics_validation
  judgments: data/credential_semantics_validation/judgments.jsonl
  replacements: data/credential_semantics_validation/replacements.jsonl
